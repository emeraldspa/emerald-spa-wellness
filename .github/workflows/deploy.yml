name: Deploy to Vercel (production)

# Every push to main deploys to production. The Vercel token lives in the
# repo's Actions secrets; the pipeline builds locally (fewer remote build
# minutes, which matter on the plan's fair-use budget) and uploads the
# prebuilt output. One team, one project, one author.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: vercel-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build (Vercel build, local)
        run: npx vercel build --prod --yes

      - name: Deploy prebuilt output to production
        run: npx vercel deploy --prebuilt --prod --yes --token "$VERCEL_TOKEN"
