name: CI (quality gate)

# Every push to main is verified here: install, typecheck, build.
#
# Production deploys do NOT run in Actions any more. The Vercel project is
# git-linked to emeraldspa/emerald-spa-wellness (Round 19 migration to the
# Emerald team, webmaster@emeraldspacc.com), so Vercel builds and ships
# every push to main on its own. This workflow is the independent check
# that the push is type-clean and builds before/while that happens.
#
# Manual deploys, if ever needed, run from a checkout with:
#   npx vercel --prod --token <token> --scope emerald-8857

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-gate
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build (Next.js production)
        run: npx next build
